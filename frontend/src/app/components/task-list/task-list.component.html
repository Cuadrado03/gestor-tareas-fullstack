<div *ngIf="isLoading">Cargando tareas...</div>

<div *ngIf="!isLoading && loadError">
  {{ loadError }}
  <button (click)="loadTasks()">Reintentar</button>
</div>

<div *ngIf="!isLoading && !loadError && tasks.length === 0">
  No hay tareas todavía.
</div>

<ul *ngIf="!isLoading && !loadError && tasks.length > 0">
  <li *ngFor="let task of tasks">
    <strong>{{ task.title }}</strong> — {{ task.status }}
    <button (click)="openEditModal(task)">Editar</button>
    <button (click)="askDelete(task)">Eliminar</button>
    <button *ngIf="nextStatus(task.status)" (click)="advanceStatus(task)">
      Avanzar a {{ nextStatus(task.status) }}
    </button>
  </li>
</ul>

<button (click)="openCreateModal()">+ Nueva tarea</button>

<app-task-form-modal
  [isOpen]="isModalOpen"
  [task]="taskBeingEdited"
  (save)="onSaveTask($event)"
  (closed)="closeModal()"
></app-task-form-modal>

<app-confirm-dialog
  [isOpen]="isConfirmOpen"
  [message]="'¿Eliminar la tarea &quot;' + (taskPendingDelete?.title ?? '') + '&quot;?'"
  (confirmed)="confirmDelete()"
  (cancelled)="cancelDelete()"
></app-confirm-dialog>
