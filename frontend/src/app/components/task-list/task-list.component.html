<div class="toolbar">
  <h2>Mis tareas</h2>
  <button class="btn btn-primary" (click)="openCreateModal()">+ Nueva tarea</button>
</div>

<div class="state-message" *ngIf="isLoading">Cargando tareas...</div>

<div class="state-message error" *ngIf="!isLoading && loadError">
  {{ loadError }}
  <button class="btn btn-secondary" (click)="loadTasks()">Reintentar</button>
</div>

<div class="state-message" *ngIf="!isLoading && !loadError && tasks.length === 0">
  No hay tareas todavía. ¡Crea la primera!
</div>

<div class="task-grid" *ngIf="!isLoading && !loadError && tasks.length > 0">
  <div class="task-card" [ngClass]="task.status" *ngFor="let task of tasks">
    <div class="task-header">
      <h3>{{ task.title }}</h3>
      <span class="status-badge" [ngClass]="task.status">{{ statusLabels[task.status] }}</span>
    </div>

    <p class="description" *ngIf="task.description">{{ task.description }}</p>
    <p class="description empty" *ngIf="!task.description">Sin descripción</p>

    <div class="task-actions">
        <button
        class="btn btn-advance"
        *ngIf="nextStatus(task.status)"
        (click)="advanceStatus(task)"
        >
        → {{ statusLabels[nextStatus(task.status)!] }}
        </button>
      <button class="btn btn-edit" (click)="openEditModal(task)">Editar</button>
      <button class="btn btn-delete" (click)="askDelete(task)">Eliminar</button>
    </div>
  </div>
</div>

<app-task-form-modal
  [isOpen]="isModalOpen"
  [task]="taskBeingEdited"
  (save)="onSaveTask($event)"
  (closed)="closeModal()"
></app-task-form-modal>

<app-confirm-dialog
  [isOpen]="isConfirmOpen"
  [message]="'¿Eliminar la tarea &quot;' + (taskPendingDelete?.title ?? '') + '&quot;?'"
  (confirmed)="confirmDelete()"
  (cancelled)="cancelDelete()"
></app-confirm-dialog>
