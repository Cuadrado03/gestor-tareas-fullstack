<div class="overlay" *ngIf="isOpen" (click)="cancelled.emit()">
  <div class="dialog" (click)="$event.stopPropagation()">
    <p>{{ message }}</p>
    <div class="actions">
      <button class="btn-cancel" (click)="cancelled.emit()">Cancelar</button>
      <button class="btn-danger" (click)="confirmed.emit()">Eliminar</button>
    </div>
  </div>
</div>
